# Learn more about web pixels:
# https://shopify.dev/docs/apps/build/marketing-analytics/build-web-pixels

[[extensions]]
type = "web_pixel"
name = "adpilot-web-pixel"
handle = "adpilot-web-pixel"

  [extensions.settings]
  [[extensions.settings.fields]]
  key = "pixel_id"
  type = "text"
  name = "Meta Pixel ID"
  description = "Your Meta Pixel ID (numbers only). Find it in AdPilot > Accounts, or in Meta Events Manager."

  [[extensions.settings.fields]]
  key = "app_url"
  type = "text"
  name = "AdPilot app URL"
  description = "Your AdPilot app URL (for the live event stream). Example: https://adpilot-production-c9f8.up.railway.app"

  [[extensions.settings.fields]]
  key = "shop"
  type = "text"
  name = "Shop domain"
  description = "Your store's myshopify.com domain. Example: your-store.myshopify.com"
