# Learn more about configuring your app:
# https://shopify.dev/docs/apps/tools/cli/configuration

# NOTE: client_id belongs to the PixelPro Partner app entry.
# Create a new Partner app entry for AdPilot and update client_id,
# application_url, and redirect_urls before deploying.
client_id = "f5feb18942e0d098f96e02c31159d136"
name = "AdPilot - Social Media Command"
handle = "adpilot-social"
application_url = "https://adpilot-production-c9f8.up.railway.app"
embedded = true

[access_scopes]
# read_products: the Compose product picker queries the Admin API product catalog.
# (write_files is NOT needed — uploads go to local /data/media.)
scopes = "read_products"

[auth]
redirect_urls = ["https://adpilot-production-c9f8.up.railway.app/auth/callback"]

[webhooks]
api_version = "2026-01"

  # Handled by: app/routes/webhooks.app.uninstalled.tsx
  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/webhooks/app/uninstalled"

  # Handled by: app/routes/webhooks.app.scopes_update.tsx
  [[webhooks.subscriptions]]
  topics = ["app/scopes_update"]
  uri = "/webhooks/app/scopes_update"

  # Handled by: app/routes/webhooks.customers.data_request.tsx
  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request"]
  uri = "/webhooks/customers/data_request"

  # Handled by: app/routes/webhooks.customers.redact.tsx
  [[webhooks.subscriptions]]
  compliance_topics = ["customers/redact"]
  uri = "/webhooks/customers/redact"

  # Handled by: app/routes/webhooks.shop.redact.tsx
  [[webhooks.subscriptions]]
  compliance_topics = ["shop/redact"]
  uri = "/webhooks/shop/redact"
